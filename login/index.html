<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CyrusLinksHub</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<canvas id="particles"></canvas>

<div class="bg-glow glow-left"></div>
<div class="bg-glow glow-right"></div>

<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">

            <span class="animated-logo">

                CYRUSLINKSHUB

            </span>

        </a>

        <nav>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>
                <li><a href="tools.html">Tools</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="about.html">About</a></li>

            </ul>

        </nav>

    </div>

</header>

<main class="auth-page">

    <div class="glass-card auth-card">

        <div class="auth-header">

            <i class="fa-solid fa-user-lock auth-icon"></i>

            <h1>Welcome Back</h1>

            <p>

                Login to your CyrusLinksHub account.

            </p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required>

            </div>

            <div class="remember-row">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="btn btn-primary auth-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <button
            id="googleLogin"
            class="btn btn-secondary auth-btn">

            <i class="fab fa-google"></i>

            Continue with Google

        </button>

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>

        <div id="loginMessage"></div>

    </div>

</main>

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/login.js"></script>

</body>

</html>
