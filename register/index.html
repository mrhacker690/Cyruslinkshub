<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | CyrusLinksHub</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<canvas id="particles"></canvas>

<div class="bg-glow glow-left"></div>
<div class="bg-glow glow-right"></div>

<header class="header">

<div class="container navbar">

<a href="index.html" class="logo">

<span class="animated-logo">

CYRUSLINKSHUB

</span>

</a>

<nav>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="tools.html">Tools</a></li>
<li><a href="games.html">Games</a></li>
<li><a href="about.html">About</a></li>

</ul>

</nav>

</div>

</header>

<main class="auth-page">

<div class="glass-card auth-card">

<div class="auth-header">

<i class="fa-solid fa-user-plus auth-icon"></i>

<h1>Create Account</h1>

<p>

Join the CyrusLinksHub Community

</p>

</div>

<form id="registerForm">

<div class="input-group">

<label>Username</label>

<input

type="text"

id="username"

placeholder="Choose a username"

required>

</div>

<div class="input-group">

<label>Email Address</label>

<input

type="email"

id="email"

placeholder="example@email.com"

required>

</div>

<div class="input-group">

<label>Password</label>

<input

type="password"

id="password"

placeholder="Minimum 6 characters"

required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input

type="password"

id="confirmPassword"

placeholder="Re-enter password"

required>

</div>

<button

type="submit"

class="btn btn-primary auth-btn">

<i class="fa-solid fa-user-check"></i>

Create Account

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button

id="googleRegister"

class="btn btn-secondary auth-btn">

<i class="fab fa-google"></i>

Continue with Google

</button>

<div class="auth-footer">

Already have an account?

<a href="login.html">

Login

</a>

</div>

<div id="registerMessage"></div>

</div>

</main>

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/register.js"></script>

</body>

</html>
