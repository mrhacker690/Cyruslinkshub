<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | CyrusLinksHub</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<canvas id="particles"></canvas>

<div class="bg-glow glow-left"></div>
<div class="bg-glow glow-right"></div>

<header class="header">

<div class="container navbar">

<a href="index.html" class="logo">

<span class="animated-logo">

CYRUSLINKSHUB

</span>

</a>

<nav>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="tools.html">Tools</a></li>
<li><a href="games.html">Games</a></li>
<li><a href="about.html">About</a></li>

</ul>

</nav>

</div>

</header>

<main class="auth-page">

<div class="glass-card auth-card">

<div class="auth-header">

<i class="fa-solid fa-key auth-icon"></i>

<h1>Forgot Password</h1>

<p>

Enter your email address to receive a password reset link.

</p>

</div>

<form id="forgotPasswordForm">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="resetEmail"
placeholder="example@email.com"
required>

</div>

<button
type="submit"
class="btn btn-primary auth-btn">

<i class="fa-solid fa-paper-plane"></i>

Send Reset Link

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<div class="auth-footer">

Remember your password?

<a href="login.html">

Login

</a>

</div>

<div class="auth-footer">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

<div id="forgotMessage"></div>

</div>

</main>

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/forgot-password.js"></script>

</body>

</html>
