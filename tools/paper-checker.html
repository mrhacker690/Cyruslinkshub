// Elements
const searchInput = document.getElementById("searchInput");
const versionSelect = document.getElementById("versionSelect");
const checkBtn = document.getElementById("checkBtn");

const mcVersion = document.getElementById("mcVersion");
const paperBuild = document.getElementById("paperBuild");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");

/* ===============================
   Search Filter
=============================== */
searchInput.addEventListener("input", function () {
    const filter = this.value.toLowerCase();
    for (let option of versionSelect.options) {
        if (option.value === "") continue;
        option.hidden = !option.value.toLowerCase().includes(filter);
    }
});

/* ===============================
   Auto Select Exact Match
=============================== */
searchInput.addEventListener("change", function () {
    const version = this.value.trim();
    if (paperBuilds[version]) {
        versionSelect.value = version;
    }
});

/* ===============================
   Check Build Function
=============================== */
function checkBuild() {
    let version = versionSelect.value;
    if (!version) {
        version = searchInput.value.trim();
    }
    if (!version) {
        alert("Please select or search a Minecraft version.");
        return;
    }

    const data = paperBuilds[version];

    if (!data) {
        mcVersion.textContent = version;
        paperBuild.textContent = "-";
        status.textContent = "Version not found.";
        downloadBtn.style.display = "none";
        return;
    }

    mcVersion.textContent = version;

    if (data.build === null) {
        paperBuild.textContent = "N/A";
        status.textContent = "No stable Paper release.";
        downloadBtn.style.display = "none";
        return;
    }

    paperBuild.textContent = "#" + data.build;
    status.textContent = "Stable Release Available";
    downloadBtn.href = data.url;
    downloadBtn.style.display = "inline-block";
}

/* ===============================
   Button
=============================== */
checkBtn.addEventListener("click", checkBuild);

/* ===============================
   Press Enter
=============================== */
searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        checkBuild();
    }
});

/* ===============================
   Dropdown Change
=============================== */
versionSelect.addEventListener("change", function () {
    searchInput.value = this.value;
});

/* ===============================
   Default Message
=============================== */
mcVersion.textContent = "-";
paperBuild.textContent = "-";
status.textContent = "Waiting for version...";
downloadBtn.style.display = "none";
