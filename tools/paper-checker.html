<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Paper Build Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minecraft Paper Build Checker</h1>
        
        <div class="form-group">
            <label for="version-select">Select Paper Version:</label>
            <select id="version-select">
                <option value="">Loading versions...</option>
            </select>
        </div>

        <button id="check-btn">Check Build</button>

        <div id="result" class="result hidden">
            <p>Official build downloader link:</p>
            <a id="download-link" href="#" target="_blank" rel="noopener noreferrer">Download Paper Build</a>
        </div>
    </div>

    <script>
        const PAPER_API_BASE = 'https://api.papermc.io/v2/projects/paper';
        const versionSelect = document.getElementById('version-select');
        const checkBtn = document.getElementById('check-btn');
        const resultDiv = document.getElementById('result');
        const downloadLink = document.getElementById('download-link');

        // Load available Paper versions
        async function loadVersions() {
            try {
                const res = await fetch(`${PAPER_API_BASE}/versions`);
                const data = await res.json();
                const versions = data.versions;

                versionSelect.innerHTML = '<option value="">-- Choose a version --</option>';
                versions.forEach(version => {
                    const option = document.createElement('option');
                    option.value = version;
                    option.textContent = `Paper ${version}`;
                    versionSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to load versions:', err);
                versionSelect.innerHTML = '<option value="">Error loading versions</option>';
            }
        }

        // Get latest build info and download URL for a version
        async function getLatestBuild(version) {
            try {
                const res = await fetch(`${PAPER_API_BASE}/versions/${version}/builds`);
                const data = await res.json();
                const builds = data.builds;
                if (!builds || builds.length === 0) {
                    throw new Error(`No builds found for version ${version}`);
                }

                // Latest build is the last one in the list
                const latestBuild = builds[builds.length - 1];
                const buildNumber = latestBuild.build;
                const downloadName = latestBuild.downloads.application.name;

                const downloadUrl = `${PAPER_API_BASE}/versions/${version}/builds/${buildNumber}/downloads/${downloadName}`;

                return {
                    build: buildNumber,
                    downloadUrl,
                    fileName: downloadName
                };
            } catch (err) {
                console.error('Failed to fetch build info:', err);
                throw err;
            }
        }

        // Handle "Check Build" click
        checkBtn.addEventListener('click', async () => {
            const selectedVersion = versionSelect.value;
            if (!selectedVersion) {
                alert('Please select a Paper version first.');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.textContent = 'Checking...';

            try {
                const buildInfo = await getLatestBuild(selectedVersion);
                downloadLink.href = buildInfo.downloadUrl;
                downloadLink.textContent = `Download ${buildInfo.fileName} (Build ${buildInfo.build})`;
                resultDiv.classList.remove('hidden');
            } catch (err) {
                alert('Failed to fetch build info. Check console for details.');
                console.error(err);
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = 'Check Build';
            }
        });

        // Initialize
        loadVersions();
    </script>
</body>
</html>
